<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ensayo · La huella que dejas</title><link rel="stylesheet" href="style.css"></head><body><div class="glow"></div><header><div class="brand">✦ LA HUELLA QUE DEJAS <span>ENSAYO</span></div><a class="footlink" href="/">Volver a la app real</a></header><main><div class="card hero"><div class="eyebrow">MODO ENSAYO · NO GUARDA NI ENVÍA VOTOS</div><h1>Una experiencia de recuerdos y gratitud</h1><p>Recorré una simulación breve de las seis fases. Esta pantalla no usa códigos, no escribe en Netlify Blobs y no cambia la lista de 11A.</p><div class="progress"><span id="progress" style="width:16%"></span></div><div class="pill" id="stepCount">Etapa 1 de 6</div><section class="question" id="content"></section><div class="actions"><button id="back" class="ghost">← Anterior</button><button id="next">Siguiente →</button></div></div></main><script>
const phases=[['Mi propia huella','¿Qué clase de compañera intentaste ser?','textarea'],['Los recuerdos que importan','Cuenta un gesto pequeño que transformó un día difícil.','textarea'],['Compañeras que dejaron huella','Piensa en tres compañeras y en recuerdos auténticos.','textarea'],['Dimensiones de la huella','Solidaridad, empatía, inclusión, inspiración y huella perdurable.','select'],['Una única elección','¿Quién permanecerá en tu memoria dentro de diez años?','select'],['La revelación','El nombre ganador solo aparece al cerrar y revelar los votos de la actividad real.','end']];let i=0;const vals={};function render(){document.getElementById('stepCount').textContent='Etapa '+(i+1)+' de 6';document.getElementById('progress').style.width=((i+1)/6*100)+'%';const [h,p,t]=phases[i];document.getElementById('content').innerHTML='<h2>'+h+'</h2><p>'+p+'</p>'+(t==='textarea'?'<textarea id="demoVal" placeholder="Escribe aquí una reflexión de ejemplo..."></textarea>':t==='select'?'<select id="demoVal"><option>Seleccionar compañera (simulación)</option><option>Compañera de ejemplo A</option><option>Compañera de ejemplo B</option></select>':'<div class="notice">Fin del ensayo. Ningún voto fue registrado.</div>');if(document.getElementById('demoVal'))document.getElementById('demoVal').value=vals[i]||'';document.getElementById('back').disabled=i===0;document.getElementById('next').textContent=i===5?'Reiniciar ensayo':'Siguiente →'}function keep(){const e=document.getElementById('demoVal');if(e)vals[i]=e.value}document.getElementById('next').onclick=()=>{keep();i=i===5?0:i+1;render()};document.getElementById('back').onclick=()=>{keep();i=Math.max(0,i-1);render()};render();
</script></body></html>
